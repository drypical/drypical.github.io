<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Drypical — Pedidos y Rutas</title>
<meta name="theme-color" content="#1b5e20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{ --verde:#1b5e20; --verde2:#2e7d32; --crema:#fff8e7; --naranja:#ef6c00; --rojo:#c62828; --amarillo:#f9a825; --gris:#5f6368; --borde:#e0ddd2; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--crema); color:#202124; }
  header{ background:var(--verde); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  header img{ height:44px; width:auto; background:#fff; border-radius:8px; padding:3px; }
  header .t{ line-height:1.15; }
  header .t b{ font-size:17px; display:block; }
  header .t span{ font-size:12px; opacity:.85; }
  header .modo{ margin-left:auto; font-size:11px; background:rgba(255,255,255,.18); padding:4px 8px; border-radius:20px; white-space:nowrap; }
  .hbtn{ background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:20px; padding:5px 11px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  nav{ display:flex; background:#fff; border-bottom:1px solid var(--borde); position:sticky; top:64px; z-index:19; }
  nav button{ flex:1; border:none; background:none; padding:12px 4px; font-size:14px; font-weight:600; color:var(--gris); border-bottom:3px solid transparent; cursor:pointer; }
  nav button.act{ color:var(--verde); border-bottom-color:var(--verde); }
  main{ padding:14px; max-width:860px; margin:0 auto; padding-bottom:90px; }
  .card{ background:#fff; border:1px solid var(--borde); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .card h3{ margin:0 0 6px; font-size:16px; }
  .muted{ color:var(--gris); font-size:13px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .sp{ flex:1; }
  .btn{ border:none; border-radius:9px; padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; background:var(--verde); color:#fff; }
  .btn.sec{ background:#e8f5e9; color:var(--verde); }
  .btn.naranja{ background:var(--naranja); }
  .btn.rojo{ background:#fdecea; color:var(--rojo); }
  .btn.chico{ padding:6px 10px; font-size:13px; border-radius:7px; }
  .fab{ position:fixed; right:16px; bottom:20px; z-index:30; background:var(--naranja); color:#fff; border:none; border-radius:30px; padding:14px 20px; font-size:15px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,.3); cursor:pointer; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:12px; color:#fff; }
  .b-verde{ background:var(--verde2); } .b-rojo{ background:var(--rojo); } .b-amar{ background:var(--amarillo); color:#4e342e; } .b-gris{ background:#9e9e9e; } .b-nar{ background:var(--naranja); }
  .alerta{ border-left:5px solid var(--rojo); } .aviso{ border-left:5px solid var(--amarillo); }
  label{ display:block; font-size:13px; font-weight:600; margin:10px 0 4px; color:#37474a; }
  input,select,textarea{ width:100%; padding:11px; border:1px solid #cfd8dc; border-radius:9px; font-size:15px; background:#fff; }
  textarea{ min-height:56px; resize:vertical; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .linea{ border:1px dashed var(--borde); border-radius:10px; padding:10px; margin-top:10px; background:#fffdf5; }
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:none; overflow-y:auto; }
  .modal.ab{ display:block; }
  .hoja{ background:#fff; max-width:640px; margin:18px auto; border-radius:14px; padding:18px; }
  .hoja h2{ margin:0 0 4px; font-size:19px; color:var(--verde); }
  .tot{ font-size:17px; font-weight:800; color:var(--verde); }
  a.tel{ color:var(--verde2); font-weight:700; text-decoration:none; }
  .vacio{ text-align:center; color:var(--gris); padding:26px 10px; font-size:14px; }
  .prod-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .prod-card{ background:#fff; border:1px solid var(--borde); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .prod-card img.foto{ width:100%; height:210px; object-fit:contain; object-position:center; display:block; background:#f3efe2; }
  .prod-card .sinfoto{ height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:#f3efe2; color:var(--gris); font-size:13px; padding:12px; text-align:center; }
  .prod-card .cuerpo{ padding:12px 14px 14px; }
  .prod-card h3{ margin:0 0 8px; font-size:16px; }
  .pres{ display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px dashed var(--borde); }
  .pres:first-of-type{ border-top:none; }
  .paso{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .paso button{ width:34px; height:34px; border-radius:50%; border:1px solid var(--borde); background:#e8f5e9; color:var(--verde); font-size:19px; font-weight:800; cursor:pointer; line-height:1; }
  .paso button:active{ background:var(--verde); color:#fff; }
  .paso .n{ min-width:30px; text-align:center; font-weight:800; font-size:16px; }
  .mini{ background:none; border:none; color:var(--gris); font-size:12px; cursor:pointer; padding:2px 4px; text-decoration:underline; }
  #login{ position:fixed; inset:0; background:var(--crema); z-index:100; display:none; padding:30px 20px; }
  #login.ab{ display:block; }
  .oculto{ display:none !important; }
  .hoja-pedido table{ width:100%; border-collapse:collapse; margin-top:12px; }
  .hoja-pedido th,.hoja-pedido td{ border:1px solid #cfd8dc; padding:7px 8px; font-size:13px; text-align:left; }
  .hoja-pedido th{ background:#e8f5e9; }
  .firmas{ display:flex; gap:30px; }
  .firma{ flex:1; text-align:center; }
  .firma .linea-f{ border-top:1.5px solid #37474a; margin-top:54px; padding-top:5px; font-size:12px; color:#37474a; }
  .firma .nombre-f{ font-weight:700; font-size:13px; margin-top:2px; min-height:16px; }
  #imprimible{ display:none; }
  @media print{ body>*:not(#imprimible){ display:none !important; } #imprimible{ display:block !important; } }
</style>
</head>

<header>
  <img src="logo.png" alt="Drypical">
  <div class="t"><b id="appTitulo">Pedidos y Rutas</b><span>Control interno · Real Fruit • Real Flavor</span></div>
  <div class="modo" id="modoBadge">Modo local</div>
  <button class="hbtn" id="langBtn" onclick="cambiarIdioma()">🌐 EN</button>

  <button data-vista="productos">Productos</button>

  <section id="vista-despachos" class="oculto"></section>

  <section id="vista-productos" class="oculto"></section>
</main>
<button class="fab" id="fabBtn">+ Nuevo</button>

<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>
<div id="imprimible"></div>

    <div style="height:12px"></div>
    <button class="btn" style="width:100%" id="li-btn" onclick="entrar()">Entrar</button>
    <p class="muted" id="li-error" style="color:var(--rojo)"></p>
  </div>
</div>

let LANG = 'es';
try { LANG = localStorage.getItem('drypical_idioma_v1') || 'es'; } catch(e){}
if(LANG !== 'en') LANG = 'es';
function tr(k){ return (TXT[LANG] && TXT[LANG][k]) || TXT.es[k] || k; }
function diaTxt(d){ return d ? tr('dia_' + d) : d; }
function estadoTxt(e){ return tr('est_' + e); }
const SABOR_EN = { 'Piña': 'Pineapple', 'Fresa': 'Strawberry', 'Naranja': 'Orange', 'Manzana': 'Apple' };
function saborTxt(s){ return LANG === 'en' ? (SABOR_EN[s] || s) : s; }
function nombreTxt(n){ if(LANG !== 'en') return n; const s = saborDe(n); return SABOR_EN[s] ? n.replace(s, SABOR_EN[s]) : n; }
function pintarModo(){ const b = $('#modoBadge'); if(b) b.textContent = NUBE ? tr('modoNube') : tr('modoLocal'); }
function cambiarIdioma(){
  LANG = LANG === 'es' ? 'en' : 'es';
  try { localStorage.setItem('drypical_idioma_v1', LANG); } catch(e){}
  aplicarIdioma();
}
function aplicarIdioma(){
  document.documentElement.lang = LANG;
  const at = $('#appTitulo'); if(at) at.textContent = tr('appTitulo');
  document.querySelectorAll('nav button').forEach(b => { b.textContent = tr('nav_' + b.dataset.vista); });
  const lb = $('#langBtn'); if(lb) lb.textContent = '🌐 ' + (LANG === 'es' ? 'EN' : 'ES');
  const ll = $('#langBtnLogin'); if(ll) ll.textContent = '🌐 ' + (LANG === 'es' ? 'EN' : 'ES');
  const sb2 = $('#salirBtn'); if(sb2) sb2.textContent = tr('salir');
  const lt = $('#li-titulo'); if(lt) lt.textContent = tr('login_titulo');
  const lc = $('#li-lbl-correo'); if(lc) lc.textContent = tr('correo');
  const lv = $('#li-lbl-clave'); if(lv) lv.textContent = tr('clave');
  const ln = $('#li-btn'); if(ln) ln.textContent = tr('entrar');
  pintarModo();
  pintar();
}
async function salir(){
  try { if(sb) await sb.auth.signOut(); } catch(e){}
  location.reload();
}

/* ---------- Enviar pedidos por correo ---------- */
const CORREO_VENTAS = 'Sales@drypical.com';
const CORREO_PEDIDOS = CORREO_VENTAS + ',Info@Drypical.com';
function enviarSeleccion(){
  const items = Object.keys(SELECCION);
  if(!items.length) return;
  const tienda = prompt(tr('pedirTiendaPrompt'));
  if(tienda === null) return;
  const total = items.reduce((s,n) => s + (SELECCION[n] || 0), 0);
  let cuerpo = tr('asuntoPedido') + ' — ' + fmtFecha(hoyISO()) + '\n';
  if(tienda.trim()) cuerpo += tr('lblTienda') + ': ' + tienda.trim() + '\n';
  cuerpo += '\n' + items.map(n => '• ' + n + ' × ' + SELECCION[n]).join('\n');
  cuerpo += '\n\n' + tr('totalLbl') + total + ' ' + tr('unidades') + '\n\n' + tr('generadoApp');
  const asunto = tr('asuntoPedido') + (tienda.trim() ? ' — ' + tienda.trim() : '') + ' — ' + fmtFecha(hoyISO());
  location.href = 'mailto:' + CORREO_PEDIDOS + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo);
}
function enviarDespacho(id){
  const d = DB.despachos.find(x => x.id === id); if(!d) return;
  const tnd = tiendaPorId(d.tiendaId);
  let cuerpo = tr('asuntoDespacho') + '\n'
    + tr('lblTienda') + ': ' + (tnd ? tnd.nombre : tr('tiendaBorrada')) + '\n'
    + tr('lblFecha') + ': ' + fmtFecha(d.fecha) + (d.hora ? ' · ' + d.hora : '') + '\n'
    + tr('lblEstado') + ': ' + estadoTxt(d.estado) + '\n\n'
    + (d.lineas || []).map(l => '• ' + l.nombre + ' × ' + l.cantidad + (l.caducidad ? tr('caducaLinea') + fmtFecha(l.caducidad) : '') + (Number(l.precio) ? ' · ' + dinero(l.precio) + tr('cU') : '')).join('\n')
    + (totalDespacho(d) ? '\n\n' + tr('totalLbl') + dinero(totalDespacho(d)) : '')
    + (d.notas ? '\n\n' + tr('lblNotas') + ': ' + d.notas : '')
    + '\n\n' + tr('generadoApp');
  const asunto = tr('asuntoDespacho') + ' — ' + (tnd ? tnd.nombre : '') + ' — ' + fmtFecha(d.fecha);
  location.href = 'mailto:' + CORREO_PEDIDOS + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo);
}

/* ---------- Almacenamiento ---------- */
function guardarLocal(){ localStorage.setItem('drypical_db_v1', JSON.stringify(DB)); }
function cargarLocal(){
  try { const raw = localStorage.getItem('drypical_db_v1'); if(raw){ DB = JSON.parse(raw); if(!DB.facturas) DB.facturas = []; return; } } catch(e){}
  DB = { tiendas: [], productos: PRODUCTOS_BASE.map(n => ({ id: uid()+n.length, nombre: n })), despachos: [], facturas: [] };
  guardarLocal();
}
async function cargarNube(){
  const [t,p,d] = await Promise.all([ sb.from('tiendas').select('*'), sb.from('productos').select('*'), sb.from('despachos').select('*') ]);
  if(t.error) throw t.error; if(p.error) throw p.error; if(d.error) throw d.error;
  DB.tiendas = t.data || []; DB.productos = p.data || []; DB.despachos = d.data || [];
  try { const f = await sb.from('facturas').select('*'); DB.facturas = f.error ? [] : (f.data || []); } catch(e){ DB.facturas = []; }
  if(!DB.productos.length){ for(const n of PRODUCTOS_BASE){ await guardar('productos', { id: uid()+Math.random().toString(36).slice(2,6), nombre: n }); } await cargarNube(); }
}
async function guardar(tabla, obj){
  if(NUBE){ const { error } = await sb.from(tabla).upsert(obj); if(error){ alert(tr('errGuardar') + error.message); throw error; } }
  const arr = DB[tabla]; const i = arr.findIndex(x => x.id === obj.id);
  if(i >= 0) arr[i] = obj; else arr.push(obj);
  if(!NUBE) guardarLocal();
}
async function borrar(tabla, id){
  if(NUBE){ const { error } = await sb.from(tabla).delete().eq('id', id); if(error){ alert(tr('errBorrar') + error.message); return; } }
  DB[tabla] = DB[tabla].filter(x => x.id !== id);
  if(!NUBE) guardarLocal();
  pintar();
}

/* ---------- Navegación ---------- */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { vista = b.dataset.vista; pintar(); }));
$('#fabBtn').addEventListener('click', () => {
  if(vista === 'tiendas') formTienda();
  else if(vista === 'productos') formProducto();
  else if(vista === 'facturas') formFactura();
  else formDespacho();
});
function pintar(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('act', b.dataset.vista === vista));
  ['panel','tiendas','despachos','facturas','productos'].forEach(v => $('#vista-'+v).classList.toggle('oculto', v !== vista));
  $('#fabBtn').textContent = vista === 'tiendas' ? tr('fab_tienda') : vista === 'productos' ? tr('fab_producto') : vista === 'facturas' ? tr('fab_factura') : tr('fab_despacho');
  if(vista === 'panel') pintarPanel();
  if(vista === 'tiendas') pintarTiendas();
  if(vista === 'despachos') pintarDespachos();
  if(vista === 'facturas') pintarFacturas();
  if(vista === 'productos') pintarProductos();
}

/* ---------- Panel ---------- */
function vencimientos(){
  const out = [];
  DB.despachos.filter(d => d.estado === 'Entregado').forEach(d => (d.lineas||[]).forEach(l => {
    const dd = diasHasta(l.caducidad);
    if(dd !== null && dd <= 30) out.push({ tienda: (tiendaPorId(d.tiendaId)||{}).nombre || tr('tiendaBorrada'), producto: l.nombre, caducidad: l.caducidad, dias: dd, cantidad: l.cantidad });
  }));
  return out.sort((a,b) => a.dias - b.dias);
}
function pintarPanel(){
  const hoyDia = DIAS[new Date().getDay()];
  const visitasHoy = DB.tiendas.filter(t => t.diaVisita === hoyDia);
  const venc = vencimientos();
  const mes = hoyISO().slice(0,7);
  const ventasMes = DB.despachos.filter(d => (d.fecha||'').startsWith(mes) && d.estado !== 'Cancelado').reduce((s,d) => s + totalDespacho(d), 0);
  let h = '<div class="grid2">'
    + '<div class="card"><h3>' + tr('ventasMes') + '</h3><div class="tot">' + dinero(ventasMes) + '</div><div class="muted">' + DB.despachos.filter(d => (d.fecha||'').startsWith(mes)).length + ' ' + tr('despachosEsteMes') + '</div></div>'
    + '<div class="card"><h3>' + tr('tiendasActivas') + '</h3><div class="tot">' + DB.tiendas.length + '</div><div class="muted">' + tr('visitasHoyLbl') + ' (' + diaTxt(hoyDia) + '): ' + visitasHoy.length + '</div></div></div>';
  const facAbiertas = DB.facturas.filter(f => f.estadoPago !== 'Pagada' && f.estadoPago !== 'Cancelada');
  if(facAbiertas.length) h += '<div class="card aviso"><h3>🧾 ' + tr('porCobrar') + '</h3><div class="tot">' + dinero(facAbiertas.reduce((s,f) => s + saldoFactura(f), 0)) + '</div><div class="muted">' + facAbiertas.length + ' ' + tr('facturasSinPagar') + '</div></div>';
  h += '<div class="card"><h3>' + tr('visitasDeHoy') + diaTxt(hoyDia) + '</h3>';
  h += visitasHoy.length ? visitasHoy.map(t => '<div class="row"><div class="sp"><b>' + esc(t.nombre) + '</b><div class="muted">' + esc(t.ruta||'') + (t.horaVisita ? ' · ' + esc(t.horaVisita) : '') + (t.direccion ? ' · ' + esc(t.direccion) : '') + '</div></div><button class="btn sec chico" onclick="formDespacho(\'' + t.id + '\')">' + tr('despachar') + '</button></div>').join('<hr style="border:none;border-top:1px solid var(--borde)">') : '<div class="vacio">' + tr('sinVisitas') + '</div>';
  h += '</div>';
  h += '<div class="card"><h3>' + tr('porVencer') + '</h3>';
  h += venc.length ? venc.map(v => '<div class="row"><span class="badge ' + (v.dias < 0 ? 'b-rojo' : v.dias <= 7 ? 'b-rojo' : 'b-amar') + '">' + (v.dias < 0 ? tr('vencido') : v.dias + ' ' + tr('dias')) + '</span><div class="sp"><b>' + esc(nombreTxt(v.producto)) + '</b> · ' + v.cantidad + ' ' + tr('uds') + '<div class="muted">' + tr('enLbl') + esc(v.tienda) + ' · ' + tr('caducaLbl') + fmtFecha(v.caducidad) + '</div></div></div>').join('<hr style="border:none;border-top:1px solid var(--borde)">') : '<div class="vacio">' + tr('nadaPorVencer') + '</div>';
  h += '</div>';
  h += '<div class="card"><h3>' + tr('rutaSemana') + '</h3>';
  h += DIAS_ORDEN.map(dia => { const ts = DB.tiendas.filter(t => t.diaVisita === dia); return '<div class="row"><b style="min-width:86px">' + diaTxt(dia) + '</b><div class="sp muted">' + (ts.length ? ts.map(t => esc(t.nombre)).join(', ') : '—') + '</div></div>'; }).join('');
  h += '</div>';
  $('#vista-panel').innerHTML = h;
}

/* ---------- Tiendas ---------- */
function pintarTiendas(){
  const el = $('#vista-tiendas');
  if(!DB.tiendas.length){ el.innerHTML = '<div class="card vacio">' + tr('sinTiendas') + '</div>'; return; }
  const orden = t => DIAS_ORDEN.indexOf(t.diaVisita);
  el.innerHTML = [...DB.tiendas].sort((a,b) => orden(a) - orden(b)).map(t => '<div class="card"><div class="row"><div class="sp"><h3>' + esc(t.nombre) + '</h3>'
    + '<div class="muted">' + (t.contacto ? '👤 ' + esc(t.contacto) + ' · ' : '') + (t.telefono ? '<a class="tel" href="tel:' + esc(t.telefono) + '">' + esc(t.telefono) + '</a>' : '') + '</div>'
    + (t.direccion ? '<div class="muted">📍 ' + esc(t.direccion) + (t.ciudad ? ', ' + esc(t.ciudad) : '') + ' · <a class="tel" target="_blank" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((t.direccion||'') + ' ' + (t.ciudad||'')) + '">' + tr('mapa') + '</a></div>' : '')
    + '<div style="margin-top:6px"><span class="badge b-verde">' + esc(t.diaVisita ? diaTxt(t.diaVisita) : tr('sinDia')) + (t.horaVisita ? ' · ' + esc(t.horaVisita) : '') + '</span> ' + (t.ruta ? '<span class="badge b-nar">' + esc(t.ruta) + '</span>' : '') + '</div>'
    + fiscalTiendaHTML(t)
    + (t.notas ? '<div class="muted" style="margin-top:6px">' + esc(t.notas) + '</div>' : '')
    + '</div></div><div class="row" style="margin-top:10px"><button class="btn chico" onclick="formDespacho(\'' + t.id + '\')">' + tr('btnDespacho') + '</button><button class="btn sec chico" onclick="formTienda(\'' + t.id + '\')">' + tr('editar') + '</button><button class="btn rojo chico" onclick="if(confirm(tr(\'confirmBorrarTienda\')))borrar(\'tiendas\',\'' + t.id + '\')">' + tr('borrar') + '</button></div></div>').join('');
}

function formTienda(id){
  const t = id ? tiendaPorId(id) : { nombre:'', contacto:'', telefono:'', direccion:'', ciudad:'', ruta:'', diaVisita:'Lunes', horaVisita:'', notas:'' };

  abrirHoja('<h2>' + (id ? tr('editarTienda') : tr('nuevaTienda')) + '</h2>'
  + '<label>' + tr('fNombreTienda') + '</label><input id="f-nombre" value="' + escA(t.nombre) + '">'
  + '<div class="grid2"><div><label>' + tr('fContacto') + '</label><input id="f-contacto" value="' + escA(t.contacto) + '"></div><div><label>' + tr('fTelefono') + '</label><input id="f-telefono" type="tel" value="' + escA(t.telefono) + '"></div></div>'
  + '<label>' + tr('fDireccion') + '</label><input id="f-direccion" value="' + escA(t.direccion) + '">'
  + '<div class="grid2"><div><label>' + tr('fCiudad') + '</label><input id="f-ciudad" value="' + escA(t.ciudad) + '"></div><div><label>' + tr('fRuta') + '</label><input id="f-ruta" placeholder="' + tr('fRutaEj') + '" value="' + escA(t.ruta) + '"></div></div>'
  + '<div class="grid2"><div><label>' + tr('fDiaVisita') + '</label><select id="f-dia">' + DIAS_ORDEN.map(d => '<option value="' + d + '" ' + (t.diaVisita === d ? 'selected' : '') + '>' + diaTxt(d) + '</option>').join('') + '</select></div><div><label>' + tr('fHoraVisita') + '</label><input id="f-hora" type="time" value="' + escA(t.horaVisita) + '"></div></div>'
  + '<label>' + tr('fNotas') + '</label><textarea id="f-notas">' + esc(t.notas) + '</textarea>'
  + '<label>' + tr('fTipoCliente') + '</label><select id="f-tipo">' + ['Detal','Mayoreo','Garnish'].map(tc => '<option value="' + tc + '" ' + ((xt.tipoCliente || 'Detal') === tc ? 'selected' : '') + '>' + tipoTxt(tc) + '</option>').join('') + '</select>'
  + '<div class="grid2"><div><label>' + tr('fCertReventa') + '</label><select id="f-cert"><option value="No" ' + (xt.certReventa !== 'Sí' ? 'selected' : '') + '>' + tr('optNo') + '</option><option value="Sí" ' + (xt.certReventa === 'Sí' ? 'selected' : '') + '>' + tr('optSi') + '</option></select></div><div><label>' + tr('fFechaCert') + '</label><input id="f-fechacert" type="date" value="' + escA(xt.fechaCertificado || '') + '"></div></div>'
  + '<label>' + tr('fNumPermiso') + '</label><input id="f-permiso" value="' + escA(xt.numPermisoComprador || '') + '">'
  + '<div class="row" style="margin-top:14px"><button class="btn sp" onclick="guardarTienda(\'' + (id||'') + '\')">' + tr('guardarTienda') + '</button><button class="btn sec" onclick="cerrarHoja()">' + tr('cancelar') + '</button></div>');
}

async function guardarTienda(id){
  const nombre = $('#f-nombre').value.trim(); if(!nombre){ alert(tr('alertNombreTienda')); return; }
  const nid = id || uid();
  await guardar('tiendas', { id: nid, nombre, contacto: $('#f-contacto').value.trim(), telefono: $('#f-telefono').value.trim(), direccion: $('#f-direccion').value.trim(), ciudad: $('#f-ciudad').value.trim(), ruta: $('#f-ruta').value.trim(), diaVisita: $('#f-dia').value, horaVisita: $('#f-hora').value, notas: $('#f-notas').value.trim() });
  /* Datos fiscales de la tienda: mapa lateral en localStorage (sin esquema). */
  ponerEnMapaLS('drypical_tiendas_extra_v1', nid, { tipoCliente: $('#f-tipo').value, certReventa: $('#f-cert').value, fechaCertificado: $('#f-fechacert').value, numPermisoComprador: $('#f-permiso').value.trim() });

   bolsa, texto nítido, sin logo montado). Formato uniforme 540×420 y
   object-fit:contain: la bolsa siempre entera, sin recortes (8-oct). */
const FOTOS_SABOR = [
  { clave: 'Piña', foto: 'img/pouch-pina.webp' },
  { clave: 'Mango', foto: 'img/pouch-mango.webp' },

  { clave: 'Tropical Mix', foto: 'img/pouch-tropical.webp' },
  { clave: 'Premium Garnish', foto: 'img/pouch-garnish.webp' }
];
const ORDEN_SABORES = ['Piña','Mango','Fresa','Naranja','Manzana','Banana','Tropical Mix','Premium Garnish'];
function saborDe(nombre){ for(const s of ORDEN_SABORES){ if(nombre.indexOf(s) === 0) return s; } return nombre.replace(/ \d+ g.*$/, '').replace(/ · .*$/, ''); }
function fotoDe(sabor){ const f = FOTOS_SABOR.find(x => x.clave === sabor); return f ? f.foto : null; }
/* Cantidades clicables: selección local en este aparato (no toca la nube). */
let SELECCION = {};
try { SELECCION = JSON.parse(localStorage.getItem('drypical_seleccion_v1') || '{}'); } catch(e){ SELECCION = {}; }
function selGuardar(){ localStorage.setItem('drypical_seleccion_v1', JSON.stringify(SELECCION)); }
function selCambiar(nombre, delta){
  SELECCION[nombre] = Math.max(0, (SELECCION[nombre] || 0) + delta);
  if(!SELECCION[nombre]) delete SELECCION[nombre];
  selGuardar(); pintarProductos();
}
function selLimpiar(){ SELECCION = {}; selGuardar(); pintarProductos(); }
function pintarProductos(){
  const el = $('#vista-productos');
  if(!DB.productos.length){ el.innerHTML = '<div class="card vacio">' + tr('sinProductos') + '</div>'; return; }
  const grupos = {};
  DB.productos.forEach(p => { const s = saborDe(p.nombre); (grupos[s] = grupos[s] || []).push(p); });
  const sabores = Object.keys(grupos).sort((a,b) => { const ia = ORDEN_SABORES.indexOf(a), ib = ORDEN_SABORES.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const totalSel = Object.values(SELECCION).reduce((s,n) => s + n, 0);
  let h = '<div class="card"><div class="row"><div class="sp"><h3>' + tr('selRapida') + '</h3><div class="muted">' + tr('selRapidaDesc') + '</div></div></div>'
    + '<div class="row" style="margin-top:8px"><span class="tot">' + totalSel + ' ' + tr('unidades') + '</span>' + (totalSel ? '<button class="btn sec chico" onclick="selLimpiar()">' + tr('limpiar') + '</button><button class="btn naranja chico" onclick="enviarSeleccion()">' + tr('enviarPedido') + '</button>' : '') + '</div>'
    + (totalSel ? '<div class="muted" style="margin-top:6px">' + Object.keys(SELECCION).map(n => esc(nombreTxt(n)) + ' × ' + SELECCION[n]).join(' · ') + '</div>' : '')
    + '</div>';
  h += '<div class="prod-grid">' + sabores.map(s => {
    const foto = fotoDe(s);
    const pres = grupos[s].map(p => '<div class="pres"><span><b>' + esc(p.nombre.replace(s, '').replace(/^\s*·\s*/, '').trim() || p.nombre) + '</b></span>'
      + '<span class="paso"><button onclick="selCambiar(\'' + escA(p.nombre) + '\',-1)" aria-label="Quitar uno">−</button><span class="n">' + (SELECCION[p.nombre] || 0) + '</span><button onclick="selCambiar(\'' + escA(p.nombre) + '\',1)" aria-label="Agregar uno">+</button></span>'
      + '<button class="mini" onclick="formProducto(\'' + p.id + '\')">' + tr('editarMin') + '</button></div>').join('');
    return '<div class="prod-card">' + (foto ? '<img class="foto" src="' + foto + '" alt="' + tr('bolsaAlt') + escA(saborTxt(s)) + '">' : '<div class="sinfoto"><span style="font-size:30px">🍓</span>' + tr('sinFotoTitulo') + '<div>' + tr('sinFotoSub') + '</div></div>')
      + '<div class="cuerpo"><h3>' + esc(saborTxt(s)) + '</h3>' + pres + '</div></div>';
  }).join('') + '</div>';
  el.innerHTML = h;
}
function formProducto(id){

function pintarLineasRefrescaTotal(){ const tot = lineasTemp.reduce((s,l) => s + (Number(l.cantidad)||0) * (Number(l.precio)||0), 0); const el = $('#f-total'); if(el) el.textContent = dinero(tot); }

/* ---------- Datos fiscales (emisor, tratamientos, extras sin esquema) ----------
   Sin cambios de esquema en Supabase: el tratamiento de impuesto de cada
   factura, su motivo de cancelación y los datos fiscales de cada tienda se
   guardan en mapas laterales en localStorage de este aparato
   (drypical_facturas_extra_v1 / drypical_tiendas_extra_v1), la misma vía
   flexible que la app ya usa para idioma, selección y emisor. Cuando exista
   una migración SQL con columnas nuevas, estos mapas se migran a la nube. */
const EMISOR_DEF = { razonSocial: 'DRYPICAL LLC', domicilio: '', ein: '', permisoTx: '', telefono: '469-515-2216', correo: 'Info@Drypical.com' };
function emisor(){

}
function guardarEmisorCfg(o){ try { localStorage.setItem('drypical_emisor_v1', JSON.stringify(o)); } catch(e){} }

function mapaLS(clave){ try { return JSON.parse(localStorage.getItem(clave) || '{}'); } catch(e){ return {}; } }
function ponerEnMapaLS(clave, id, patch){ const m = mapaLS(clave); m[id] = Object.assign({}, m[id], patch); try { localStorage.setItem(clave, JSON.stringify(m)); } catch(e){} }
/* --- Tiendas: datos fiscales (mapa lateral) --- */
function extraTienda(id){ return mapaLS('drypical_tiendas_extra_v1')[id] || {}; }
function tipoClienteDe(t){ if(!t) return 'Detal'; return extraTienda(t.id).tipoCliente || 'Detal'; }
function tipoTxt(tc){ return tr('tipo_' + (tc || 'Detal')); }
function tratamientoDefaultTienda(tiendaId){
  const tc = tipoClienteDe(tiendaPorId(tiendaId));
  return (tc === 'Mayoreo' || tc === 'Garnish') ? 'REVENTA' : 'EXENTO_ALIMENTO';
}
function fiscalTiendaHTML(t){
  const x = extraTienda(t.id); const tc = x.tipoCliente || 'Detal';
  if(tc === 'Detal' && !x.numPermisoComprador) return '';
  return '<div class="muted" style="margin-top:6px">🏷️ ' + tipoTxt(tc) + (tc !== 'Detal' ? ' · ' + tr('fCertReventa') + ': ' + (x.certReventa === 'Sí' ? tr('optSi') + (x.fechaCertificado ? ' (' + fmtFecha(x.fechaCertificado) + ')' : '') : tr('optNo')) : '') + (x.numPermisoComprador ? ' · ' + tr('fNumPermiso') + ': ' + esc(x.numPermisoComprador) : '') + '</div>';
}
/* --- Facturas: tratamiento y cancelación (mapa lateral) --- */
function extraFactura(id){ return mapaLS('drypical_facturas_extra_v1')[id] || {}; }
function tratamientoDe(f){
  if(!f) return 'EXENTO_ALIMENTO';
  const x = extraFactura(f.id).tratamiento; if(x) return x;
  if(Number(f.impuestoPct) > 0) return 'GRAVABLE';
  return tratamientoDefaultTienda(f.tiendaId);
}
function motivoCancelDe(f){ return f ? (extraFactura(f.id).motivoCancelacion || '') : ''; }
/* --- Copia del cliente dentro de la factura (seguro anti-borrado) ---
   Al emitir, se guarda una copia de los datos de la tienda en el mapa
   lateral de la factura (mismo mecanismo que tratamiento y motivo).
   Así, si la tienda se borra o se edita después, la factura vieja se
   reimprime, se manda por correo/WhatsApp y sale en el reporte con los
   datos del cliente TAL como estaban al emitirse. Las facturas emitidas
   antes de este arreglo no tienen copia y siguen usando la tienda viva. */
function snapshotClienteDe(tiendaId){
  const t = tiendaPorId(tiendaId); if(!t) return null;
  return { nombre: t.nombre || '', contacto: t.contacto || '', telefono: t.telefono || '', direccion: t.direccion || '', ciudad: t.ciudad || '' };
}
function clienteDeFactura(f){
  if(!f) return null;
  const snap = extraFactura(f.id).cliente;
  if(snap && snap.nombre) return snap;
  return tiendaPorId(f.tiendaId) || null;
}
function tratTxt(t){ return tr('trat_' + t); }
function leyendaTratamiento(f){
  const t = tratamientoDe(f);
  if(t === 'REVENTA') return tr('leyenda_REVENTA');
  if(t === 'GRAVABLE') return tr('leyenda_GRAVABLE');
  return tr('leyenda_EXENTO');
}

/* --- Reporte fiscal mensual --- */
let mesReporte = hoyISO().slice(0,7);
let datosReporte = null;
let reporteSheetHTML = '';
function verReporteFiscal(){
  const mes = mesReporte || hoyISO().slice(0,7);
  const delMes = DB.facturas.filter(f => (f.fechaEmision || '').startsWith(mes));
  const activas = delMes.filter(f => f.estadoPago !== 'Cancelada');
  const canceladas = delMes.filter(f => f.estadoPago === 'Cancelada');
  const grupos = { EXENTO_ALIMENTO: [], REVENTA: [], GRAVABLE: [] };
  activas.forEach(f => { const k = tratamientoDe(f); (grupos[k] = grupos[k] || []).push(f); });
  const suma = arr => arr.reduce((s,f) => s + totalFactura(f), 0);
  const impTotal = activas.reduce((s,f) => s + impuestoFactura(f), 0);
  const totFac = activas.reduce((s,f) => s + totalFactura(f), 0);
  const totPag = activas.reduce((s,f) => s + (Number(f.montoPagado)||0), 0);
  datosReporte = { mes, filas: delMes };
  const filasG = ['EXENTO_ALIMENTO','REVENTA','GRAVABLE'].map(k => '<tr><td>' + tratTxt(k) + '</td><td style="text-align:center">' + (grupos[k] || []).length + '</td><td style="text-align:right">' + dinero(suma(grupos[k] || [])) + '</td></tr>').join('');
  const sheet = '<div class="hoja-pedido">' + encabezadoEmisorHTML()
    + '<h2 style="margin:14px 0 4px;color:var(--verde)">' + tr('reporteTitulo') + ' · ' + esc(mes) + '</h2>'
    + '<h3 style="margin:14px 0 4px">' + tr('repPorTratamiento') + '</h3>'
    + '<table><thead><tr><th>' + tr('repTratamiento') + '</th><th style="text-align:center;width:80px">' + tr('repFacturasN') + '</th><th style="text-align:right;width:120px">Total</th></tr></thead><tbody>' + filasG + '</tbody></table>'
    + '<div style="text-align:right;margin-top:10px;font-size:14px;line-height:1.7"><div>' + tr('repImpuestoCobrado') + ': ' + dinero(impTotal) + '</div><div>' + tr('repTotalFacturado') + ': ' + dinero(totFac) + '</div><div>' + tr('repTotalPagado') + ': ' + dinero(totPag) + '</div><div class="tot">' + tr('repSaldoPend') + ': ' + dinero(totFac - totPag) + '</div></div>'
    + '<h3 style="margin:16px 0 4px">' + tr('repCanceladas') + ' (' + canceladas.length + ')</h3>'
    + (canceladas.length ? canceladas.map(f => '<div class="muted">• ' + esc(f.numero) + ' · ' + esc((clienteDeFactura(f)||{}).nombre || tr('tiendaBorrada')) + ' · ' + dinero(totalFactura(f)) + (motivoCancelDe(f) ? ' · ' + esc(motivoCancelDe(f)) : '') + '</div>').join('') : '<div class="muted">' + tr('repSinDatos') + '</div>')
    + '</div>';
  reporteSheetHTML = sheet;

function maxNumeroFactura(){
  /* Numeración a prueba de huecos: se deriva del MÁXIMO número INV- emitido
     (las canceladas cuentan, porque nunca se borran) más una marca de agua
     persistente en este aparato. Un número emitido jamás se reutiliza. */
  let max = 1000;
  DB.facturas.forEach(x => { const m = /^INV-(\d+)$/.exec(x.numero || ''); if(m) max = Math.max(max, Number(m[1])); });
  try { max = Math.max(max, Number(localStorage.getItem('drypical_inv_max_v1')) || 0); } catch(e){}
  return max;
}

    + '</div>'

    + (f.estadoPago === 'Cancelada' && motivoCancelDe(f) ? '<div style="margin-top:8px;font-size:13px;color:var(--rojo)"><b>' + tr('motivoCancelLbl') + ':</b> ' + esc(motivoCancelDe(f)) + '</div>' : '')
    + (f.notas ? '<div style="margin-top:10px;font-size:13px"><b>' + tr('lblNotas') + ':</b> ' + esc(f.notas) + '</div>' : '')
    + '<div style="margin-top:16px;font-size:13px;color:#37474a">' + tr('pagoANombre') + ' · Tel. ' + esc(emisor().telefono) + '</div>'
    + '<div style="text-align:center;margin-top:22px;font-size:12px;color:#5f6368">' + tr('gracias') + ' · Real Fruit • Real Flavor</div>'
    + '</div>';
  abrirHoja(sheet + '<div class="row" style="margin-top:18px"><button class="btn sp" onclick="imprimirHoja()">' + tr('imprimir') + '</button><button class="btn sec" onclick="cerrarHoja()">' + tr('cerrar') + '</button></div>');
  $('#imprimible').innerHTML = sheet;
}
function cuerpoFacturaTxt(f){
  const tnd = clienteDeFactura(f);
  const desp = f.despachoId ? DB.despachos.find(x => x.id === f.despachoId) : null;
  return tr('facturaTitulo') + ' ' + f.numero + ' — ' + emisor().razonSocial + '\n'
    + tr('lblTienda') + ': ' + (tnd ? tnd.nombre : tr('tiendaBorrada')) + '\n'
    + tr('fEmision') + ': ' + fmtFecha(f.fechaEmision) + ' · ' + tr('fVencimiento') + ': ' + fmtFecha(f.fechaVencimiento) + '\n'
    + (desp ? tr('desdeDespacho') + folioDe(desp) + '\n' : '')
    + '\n'
    + (f.lineas || []).map(l => '• ' + l.nombre + ' × ' + l.cantidad + ' · ' + dinero(l.precio) + tr('cU')).join('\n')
    + '\n\n' + tr('subtotal') + ': ' + dinero(subtotalFactura(f))
    + '\n' + tr('impuestoLbl') + ': ' + dinero(impuestoFactura(f))
    + '\nTotal: ' + dinero(totalFactura(f))
    + (Number(f.montoPagado) ? '\n' + tr('pagadoLbl') + ': ' + dinero(f.montoPagado) : '')
    + (saldoFactura(f) > 0 ? '\n' + tr('saldoLbl') + ': ' + dinero(saldoFactura(f)) : '')
    + '\n\n' + leyendaTratamiento(f)
    + '\n\n' + tr('pagoANombre') + ' · ' + emisor().correo + ' · Tel. ' + emisor().telefono
    + '\n\n' + tr('generadoApp');
}

function enviarFactura(id){
  const f = DB.facturas.find(x => x.id === id); if(!f) return;
  const asunto = tr('facturaTitulo') + ' ' + f.numero + ' — Drypical LLC';
  location.href = 'mailto:' + CORREO_PEDIDOS + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpoFacturaTxt(f));
}
function enviarFacturaWA(id){
  const f = DB.facturas.find(x => x.id === id); if(!f) return;
  const tnd = clienteDeFactura(f); if(!tnd || !tnd.telefono) return;
  let tel = String(tnd.telefono).replace(/\D/g, '');
  if(tel.length === 10) tel = '1' + tel;
  window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(cuerpoFacturaTxt(f)), '_blank');
}

/* ---------- Hoja de pedido ---------- */
function folioDe(d){
  if(d.folio) return d.folio;
  const orden = [...DB.despachos].sort((a,b) => (a.fecha || '').localeCompare(b.fecha || '') || String(a.id).localeCompare(String(b.id)));
  const i = orden.findIndex(x => x.id === d.id);
  return 'DRY-' + (1001 + (i < 0 ? 0 : i));
}
function siguienteFolio(){
  let max = 1000 + DB.despachos.length;
  DB.despachos.forEach(x => { const m = /^DRY-(\d+)$/.exec(x.folio || ''); if(m) max = Math.max(max, Number(m[1])); });
  return 'DRY-' + (max + 1);
}
function verHoja(id){
  const d = DB.despachos.find(x => x.id === id); if(!d) return;
  const tnd = tiendaPorId(d.tiendaId) || {};
  const facH = DB.facturas.find(x => x.despachoId === d.id && x.estadoPago !== 'Cancelada');
  const filas = (d.lineas || []).map(l => '<tr><td>' + esc(nombreTxt(l.nombre)) + (l.caducidad ? '<div style="font-size:11px;color:#666">' + tr('fCaducidad') + ': ' + fmtFecha(l.caducidad) + '</div>' : '') + '</td><td style="text-align:center">' + (Number(l.cantidad) || 0) + '</td><td style="text-align:right">' + dinero(l.precio || 0) + '</td><td style="text-align:right">' + dinero((Number(l.cantidad) || 0) * (Number(l.precio) || 0)) + '</td></tr>').join('');
  const sheet = '<div class="hoja-pedido">'
    + encabezadoEmisorHTML()
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:14px"><h2 style="margin:0;color:var(--verde)">' + tr('hojaTitulo') + '</h2><div style="text-align:right;font-size:13px"><div><b>' + tr('ordenNo') + ':</b> ' + folioDe(d) + '</div><div><b>Factura / Invoice N.º:</b> ' + (facH ? esc(facH.numero) : '____________') + '</div><div><b>' + tr('lblFecha') + ':</b> ' + fmtFecha(d.fecha) + (d.hora ? ' · ' + esc(d.hora) : '') + '</div><div><b>' + tr('lblEstado') + ':</b> ' + estadoTxt(d.estado) + '</div></div></div>'
    + '<div style="margin-top:12px;font-size:14px;line-height:1.55"><div><b>' + tr('lblTienda') + ':</b> ' + esc(tnd.nombre || tr('tiendaBorrada')) + '</div>'
    + (tnd.direccion ? '<div><b>' + tr('fDireccion') + ':</b> ' + esc(tnd.direccion) + (tnd.ciudad ? ', ' + esc(tnd.ciudad) : '') + '</div>' : '')
    + (tnd.telefono ? '<div><b>' + tr('fTelefono') + ':</b> ' + esc(tnd.telefono) + '</div>' : '')
    + (tnd.contacto ? '<div><b>' + tr('fContacto') + ':</b> ' + esc(tnd.contacto) + '</div>' : '')
    + '<div><b>' + tr('entregadoPor') + ':</b> ' + esc(d.repartidor || '—') + '</div></div>'
    + '<table><thead><tr><th>' + tr('fProducto') + '</th><th style="text-align:center;width:60px">' + tr('fCantidad') + '</th><th style="text-align:right;width:90px">' + tr('fPrecio') + '</th><th style="text-align:right;width:100px">' + tr('subtotal') + '</th></tr></thead><tbody>' + filas + '</tbody></table>'
    + '<div style="text-align:right;margin-top:10px"><span class="tot">' + tr('totalLbl') + dinero(totalDespacho(d)) + '</span></div>'
    + (d.notas ? '<div style="margin-top:10px;font-size:13px"><b>' + tr('lblNotas') + ':</b> ' + esc(d.notas) + '</div>' : '')
    + '<div style="text-align:center;margin-top:30px;font-size:12px;color:#37474a">Mercancía recibida conforme · Merchandise received in good order</div>'
    + '<div class="firmas"><div class="firma"><div class="linea-f">' + tr('firmaVendedor') + '</div><div class="nombre-f">' + esc(d.repartidor || '') + '</div></div><div class="firma"><div class="linea-f">' + tr('firmaGerente') + '</div><div class="nombre-f">' + esc(tnd.contacto || '') + '</div></div></div>'
    + '<div style="text-align:center;margin-top:26px;font-size:12px;color:#5f6368">' + tr('gracias') + ' · Real Fruit • Real Flavor</div>'
    + '</div>';
  abrirHoja(sheet + '<div class="row" style="margin-top:18px"><button class="btn sp" onclick="imprimirHoja()">' + tr('imprimir') + '</button><button class="btn sec" onclick="cerrarHoja()">' + tr('cerrar') + '</button></div>');
  $('#imprimible').innerHTML = sheet;
}
function imprimirHoja(){ window.print(); }

/* ---------- Utilidades UI ---------- */
function abrirHoja(html){ $('#hoja').innerHTML = html; $('#modal').classList.add('ab'); window.scrollTo(0,0); }
function cerrarHoja(){ $('#modal').classList.remove('ab'); }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') cerrarHoja(); });
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s){ return esc(s).replace(/"/g,'&quot;'); }

/* ---------- Arranque ---------- */
async function iniciar(){
  pintarModo();
  if(NUBE){
    let espera = 0;
    while(!window.__crearSupabase && espera < 6000){ await new Promise(r => setTimeout(r, 150)); espera += 150; }
    sb = window.__crearSupabase(CFG.supabaseUrl, CFG.supabaseAnonKey);
    const { data } = await sb.auth.getSession();
    if(!data.session){ $('#login').classList.add('ab'); aplicarIdioma(); return; }
    $('#salirBtn').style.display = '';
    await cargarNube();
  } else {
    cargarLocal();
  }
  aplicarIdioma();
}
async function entrar(){
  const correo = $('#li-correo').value.trim(), clave = $('#li-clave').value;
  const { error } = await sb.auth.signInWithPassword({ email: correo, password: clave });
  if(error){ $('#li-error').textContent = tr('loginError') + error.message; return; }
  $('#login').classList.remove('ab');
  $('#salirBtn').style.display = '';
  await cargarNube(); aplicarIdioma();
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
iniciar();
</script>
